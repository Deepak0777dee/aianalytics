<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | Stackly AI Analytics</title>
  <meta name="description" content="The page you are looking for does not exist or has been moved." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="error-page">
    <div class="error-content">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>Oops! The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
        <a href="index.html" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Back to Home
        </a>
        <a href="contact.html" class="btn btn-outline">Contact Support</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof gsap !== 'undefined') {
        gsap.from('.error-content h1', { y: -50, opacity: 0, duration: 0.8, ease: 'power3.out' });
        gsap.from('.error-content h2', { y: 30, opacity: 0, duration: 0.7, delay: 0.2, ease: 'power3.out' });
        gsap.from('.error-content p', { y: 20, opacity: 0, duration: 0.6, delay: 0.4, ease: 'power3.out' });
        gsap.from('.error-content .btn', { y: 20, opacity: 0, duration: 0.5, delay: 0.6, stagger: 0.1, ease: 'power3.out' });
      }
    });
  </script>
</body>
</html>
